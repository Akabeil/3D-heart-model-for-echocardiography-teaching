<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Real Heart Probe Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: PBSim instrument (image + coach | 3D probe, plane and real heart), then a probe-position assistant card and model notes.
   Tokens and component styles are injected by sim-engine.js; this block styles the first paint, the loader and the cards this page adds. */
html{background:#E6D3D4;color:#2A1417}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background:#1B1013;color:#F3E7E8}html:not([data-theme="light"]) #hr-bar i{background:#E58A98}}
html[data-theme="dark"]{background:#1B1013;color:#F3E7E8}html[data-theme="dark"] #hr-bar i{background:#E58A98}
#hr-load{font:16px/1.5 "Figtree",system-ui,sans-serif;max-width:520px;margin:18vh auto 0;padding:0 16px;text-align:center}
#hr-load b{display:block;font:600 27px/1.1 "Cormorant Garamond",Georgia,serif;margin-bottom:8px}
#hr-bar{height:6px;border-radius:3px;background:rgba(120,140,145,.28);overflow:hidden;margin:14px auto 0;max-width:280px}
#hr-bar i{display:block;height:100%;width:0;background:#8E2D3B}
#hr-asst h3,#hr-notes h3{font-family:var(--font-display);font-weight:600;font-size:19px;margin:12px 0 6px}
#hr-asst .as-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
#hr-asst .as-where{font-size:15.5px;line-height:1.5}
#hr-asst .as-where b{font-weight:600}#hr-asst .as-where b.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
#hr-asst table{border-collapse:collapse;width:100%;font-size:14.5px}
#hr-asst td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
#hr-asst td.n{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#hr-asst .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
#hr-asst .bar i{display:block;height:100%;background:var(--teal)}
#hr-asst .ok{color:var(--sun-text);font-weight:600}
#hr-asst .chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer;font-weight:600}
#hr-asst .chk input{width:22px;height:22px;accent-color:var(--teal)}
#hr-asst .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13.5px}
#hr-asst .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#hr-notes summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.15;min-height:44px;display:flex;align-items:center}
#hr-notes ul{margin:0;padding-left:20px;max-width:74ch}#hr-notes li{margin:3px 0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<div id="app"><div id="hr-load"><b>Real Heart Probe Lab</b><span id="hr-msg">Loading the heart model…</span><div id="hr-bar"><i id="hr-fill"></i></div></div></div>
<noscript><p style="padding:16px">This simulator needs JavaScript. Educational simulation with modelled anatomy. Not a diagnostic device.</p></noscript>
<script src="sim-engine.js"></script>
<script>
/* sim-heart-real — Bench session s4 companion: every standard TTE window on a REAL human heart. Built on PBSim (sim-engine.js).
   World mm: x = patient left, y = superior, z = anterior (PBSim convention).
   HEART: one perfusion-fixed human heart from the University of Minnesota Visible Heart Laboratories (specimen HH289), supplied as five
   3D-printable TEE teaching sets cut from the same scan. The four pieces of the ME four-/two-chamber set were reassembled in their common frame,
   voxelised by ray parity (0.6 mm), chambers derived as enclosed blood (LV, LA, RV, RA split at the valve necks by watershed; aorta and pulmonary
   trunk from their own lumens), thin tissue within 14-18 mm of each valve centre labelled as valve, then resampled to 0.7 mm.
   The heart is placed rigidly (no scaling) onto the landmark positions of the Bench's TTESim heart (MV, TV, AV, PV, apex, chamber centres;
   residual 4-14 mm) so the chest wall, ribs, lungs, liver and spine below are the same procedural torso as sim-cardiac.
   It is static: one fixed (diastolic) shape, no motion. Licence: (c) Regents of the University of Minnesota; permission needed before release.
   Data file sim-heart-real.txt = base64(gzip(TIS | LAB | HD)), uint8 each, C-order [x][y][z] in the heart's own frame:
   TIS smoothed tissue density (0-255, tissue > 128), LAB 1 RA 2 LA 3 RV 4 LV 5 great vessel 6 valve, HD distance outside the heart (0.25 mm units). */
(function () {

  { key: 'GAS', echo: 0.75, reflect: 0.96, spec: 0.5, dirty: 0.6 },

  { key: 'CART', echo: 0.03, speck: 0.3, atten: 1.5, spec: 0.3 },

/* ---------------- data */

function load() {

  card.querySelector('#as-ghost').addEventListener('change', function (e) { ASST.on = e.target.checked; sim.redraw(); sim.redraw3d && sim.redraw3d(); });
  card.querySelector('#as-cham').addEventListener('change', function (e) { ASST.cham = e.target.checked; sim.redraw(); sim.redraw3d && sim.redraw3d(); });
}
load().then(start).catch(function (e) { if (window.console) console.error('heart-real:', e); var m = document.getElementById('hr-msg'); if (m) m.textContent = 'The heart model did not load (' + e.message + ').'; });
})();
</script>
