<style>
/* Layout: brand header and view chooser over two instrument panes (image with coach | 3D probe, plane and beating heart), probe controls and teaching notes beneath.

html{background:#E6D3D4;color:#2A1417}

html[data-theme="dark"]{background:#1B1013;color:#F3E7E8}html[data-theme="dark"] #cp-bar i{background:#E58A98}
#cp-load{font:16px/1.5 "Figtree",system-ui,sans-serif;max-width:520px;margin:18vh auto 0;padding:0 16px;text-align:center}
#cp-load b{display:block;font:600 27px/1.1 "Cormorant Garamond",Georgia,serif;margin-bottom:8px}
#cp-bar{height:6px;border-radius:3px;background:rgba(120,140,145,.28);overflow:hidden;margin:14px auto 0;max-width:280px}
#cp-bar i{display:block;height:100%;width:0;background:#8E2D3B}
#cp-clips summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.15;min-height:44px;display:flex;align-items:center}
#cp-clips .cl-note{margin:2px 0 12px;max-width:72ch}
#cp-clips .cl-main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:760px){#cp-clips .cl-main{grid-template-columns:1fr}}
#cp-clips video{display:block;width:100%;aspect-ratio:4/3;background:#000;border-radius:6px}
#cp-clips .cl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
#cp-clips .cl-bar b{font-family:var(--font-display);font-size:19px;font-weight:600;margin-right:auto;min-width:0}
#cp-clips .cl-list{display:flex;flex-direction:column;gap:14px;min-width:0}
#cp-clips h3{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0 0 6px}
#cp-clips .cl-g{display:flex;flex-wrap:wrap;gap:6px}
#cp-clips .cl-b{min-height:44px;padding:6px 12px;border-radius:var(--r-leaf);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
#cp-clips .cl-b[aria-pressed="true"]{background:var(--teal-fill);border-color:var(--teal-line);color:var(--teal);font-weight:600}
#cp-clips .cl-sp[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
#cp-mm .cp-mmo{margin:0;padding:6px 10px;font-size:13.5px;color:var(--scr-ink,#ECE5E4);background:#000;border-top:1px solid var(--grid)}
#cp-report summary{cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.15;min-height:44px;display:flex;align-items:center}
#cp-report .rp-intro{margin:4px 0 12px;max-width:74ch}
#cp-report .rp-f{display:grid;grid-template-columns:minmax(140px,190px) minmax(0,1fr);gap:6px 16px;padding:12px 0;border-top:1px solid var(--line)}
@media(max-width:760px){#cp-report .rp-f{grid-template-columns:1fr}}
#cp-report .rp-f>b{font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.25}
#cp-report .rp-f>div{display:flex;flex-direction:column;gap:8px;min-width:0}

#cp-report .rp-row>span{min-width:11em;font-size:14.5px}
#cp-report select,#cp-report input[type=text],#cp-report textarea{font:inherit;font-size:15px;min-height:40px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
#cp-report input[type=text],#cp-report textarea{width:100%}
#cp-report textarea{min-height:64px;resize:vertical}
#cp-report .rp-src{font-size:13px;color:var(--muted)}
#cp-report .rp-warn{font-size:14px;color:var(--warn,#7A4A00);font-weight:600}
#cp-report .rp-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#cp-report .rp-bar button{min-height:44px;padding:6px 14px;border-radius:var(--r-leaf);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}

#cp-proto ol{margin:0;padding-left:22px;max-width:74ch}#cp-proto li{margin:5px 0}#cp-proto li::marker{color:var(--teal);font-weight:600}

.cp-phys input[type=range]{width:100%;accent-color:var(--teal);min-height:44px}
.cp-chk{display:flex;gap:12px;align-items:flex-start;min-height:44px;cursor:pointer}
.cp-chk input{width:22px;height:22px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--teal)}

  { id: 'eff-small', name: 'Small pericardial effusion', answer: 'Pericardial effusion without collapse', group: 'Pericardium', view: 'plax', views: ['plax', 'subx', 'a4c', 'psax-pm'],

      ['Size alone does not predict tamponade: tolerance depends more on how fast fluid accumulates than on its volume, so a slow effusion can grow large before pressure rises, while a small rapid post-procedure bleed can cause tamponade (ESC 2015, Adler · PMID 26320112).', 'A left pleural effusion lies behind the descending aorta and is the commonest mimic.'],

  { id: 'tamp', name: 'Tamponade: effusion with chamber collapse', answer: 'Tamponade physiology (effusion with chamber collapse)', group: 'Pericardium', view: 'subx', views: ['subx', 'a4c', 'plax', 'psax-pm', 'ivc'],

      ['Collapse is phase-specific. RV collapse in systole is normal contraction; the finding is diastolic inversion.', 'Positive-pressure ventilation and raised right-sided pressures blunt collapse and IVC change; a loculated post-surgical collection can tamponade one chamber without a circumferential effusion.', 'Hypovolaemia (a post-dialysis patient) makes chambers collapse with a smaller effusion.'],

  { id: 'rvdil', name: 'Dilated RV with septal flattening', answer: 'Right ventricular dilation with septal flattening', group: 'Ventricular function', view: 'a4c', views: ['a4c', 'psax-pm', 'subx', 'plax', 'ivc'],

      ['A4C: compare basal diameters at end-diastole. The RV is normally no more than two-thirds of the LV, and an RV larger than the LV is likely significantly enlarged (Rudski 2010 · PMID 20620859, qualitative); basal RV over 41 mm is enlarged (Lang 2015 · PMID 25559473).', 'PSAX mid-papillary: when does the septum flatten? In systole it is pressure overload (pulmonary hypertension, PE); in diastole it suggests volume overload (e.g. TR, atrial septal defect); a D-shaped septum is not diagnostic on its own (Rudski 2010).', 'RV function: TAPSE under 17 mm, fractional area change under 35% or S′ under 9.5 cm/s is abnormal (Lang 2015). TAPSE on the M-mode strip: press M, tap the lateral tricuspid annulus to put the line through it, freeze, and measure how far the annulus moves from peak to trough (simulator scale).', 'IVC and hepatic veins (Session 5, VExUS) read the venous side of the same problem.'],

  { id: 'ar', name: 'Aortic regurgitation', answer: 'Aortic regurgitation', group: 'Valves', view: 'plax', views: ['plax', 'a5c', 'a3c'],
    apply: function (S) { S.jets.push(jet(LM.AV, sub(add(LM.LV, [6, -6, 2]), LM.AV), T.VES, T.LVB, 'dia', 420, 55, 3, 12, 8)); S.focus = { p: LM.AV }; },

var altered = false;
function applyErr(api, err) {
  var t = api.target, st = api.st, p = null;
  if (altered) { st.gain = 1; st.depth = VDEPTH[st.view] || 16; altered = false; }
  if (err === 'fore') {
    var O = skin.project(add(t.O, [-8, 34, 6])).p, N = nrm(cross(sub(LM.MV, O), sub(LM.TV, O))), n = sub(mul(add(LM.MV, LM.TV), 0.5), O); n = nrm(sub(n, mul(N, dot(n, N))));
    var u = cross(N, n); if (dot(u, t.u) < 0) u = mul(u, -1); p = { O: O, n: n, u: u };
  } else if (err === 'oval') {                                                           // probe slid toward the apex and rotated: the plane crosses the ventricle obliquely
    var O2 = skin.project(add(t.O, [12, -34, 0])).p, n2 = nrm(sub(mid(LM.MV, LM.APEX), O2)), u2 = nrm(sub(t.u, mul(n2, dot(t.u, n2)))); p = { O: O2, n: n2, u: V.rot(u2, n2, 30 * D2R) };
  }
  else if (err === 'mir') p = { O: t.O, n: t.n, u: mul(t.u, -1) };
  else if (err === 'shal') { st.depth = 9; altered = true; }
  else if (err === 'gain') { st.gain = 2.1; altered = true; }
  api.setPose(p || { O: t.O, n: t.n, u: t.u }); api.redraw();
}
function later(f) { Promise.resolve().then(f); }                                   // run after the engine has finished placing the probe
function defaults() { return { err: null, hr: 70, af: false, eff: 0, effPost: 0.7, tamp: false, swing: 0, pleural: false, lvCav: 1, lvWall: 1, rvDil: 1, ivcDil: 1, press: 0, ef: 1, calcAV: false, mac: false, asJet: false, jets: [], focus: null }; }
var lastKey = '';
function onState(S, api) {
  if (rpSync) later(rpSync);                                       // keep the report panel's simulator line and check current
  if (S.err) later(function () { applyErr(api, S.err); });
  else if (altered) later(function () { altered = false; api.st.gain = 1; api.st.depth = VDEPTH[api.st.view] || 16; var t = api.target; api.setPose({ O: t.O, n: t.n, u: t.u }); api.redraw(); });
  EFMAP = S.ef < 1 ? (buildEFMap(S.ef), EFMAP) : null;
  var key = api.st.variant + '|' + api.st.view;
  if (key !== lastKey) { lastKey = key; later(function () {                            // a finding with a jet opens colour over the valve on first arrival in a view
    if (!S.focus) api.st.colour = false;
    if (S.focus) { var q = api.world2img(S.focus.p), b = api.st.box; if (q.ok) { b.c = Math.min(1 - 0.21, Math.max(0.21, q.c)); b.r = Math.min(1 - 0.21, Math.max(0.21, q.r)); b.w = 0.42; b.h = 0.42; } api.st.colour = true; api.st.scale = 60; api.redraw(); }
    syncPhys();
  }); }
}
function syncPhys() { var hr = document.getElementById('cp-hr'), af = document.getElementById('cp-af'), o = document.getElementById('cp-hr-o'); if (!hr || !sim) return; hr.value = sim.S.hr; o.textContent = sim.S.hr + ' bpm'; af.checked = !!sim.S.af; }

    '<p class="pb-muted" style="margin:4px 0 10px;max-width:72ch">Choose a finding under “Finding shown” to load it into the simulator; the notes beside the image say what to look for in each view. These protocols are the order of work at the bedside. Reference values are from the guidelines named, checked against PubMed.</p>' +
    '<h3>Pericardial effusion and tamponade</h3><ol>' +
    '<li><b>Subxiphoid first</b>, supine, knees flexed: fluid between the liver and the RV free wall. If the window fails, PLAX.</li>' +
    '<li><b>PLAX</b>: find the descending aorta behind the LA. Pericardial fluid passes in front of it; pleural fluid lies behind it.</li>' +
    '<li><b>Size</b> the largest pocket at end-diastole: under 10 mm small, 10–20 mm moderate, over 20 mm large (Klein 2013 · PMID 23998693). Say where it is.</li>' +
    '<li><b>Collapse</b>: freeze and step through the cycle. RA inversion in late diastole lasting more than a third of the cycle; RV free-wall inversion in early diastole (mitral valve open).</li>' +
    '<li><b>IVC</b>: over 21 mm with under 50% collapse supports tamponade and is nearly always present (Session 5 simulator).</li>' +
    '<li><b>Clinical correlation</b>: blood pressure, heart rate, JVP, ventilation. Tamponade is judged clinically, with echocardiography the key supporting test (ESC 2015, Adler · PMID 26320112).</li>' +
    '<li><b>Mimics</b>: epicardial fat, pleural effusion, ascites, loculated post-operative collections. Over-gain erases small effusions.</li>' +
    '<li><b>Escalate</b> on collapse signs or haemodynamic compromise; a stable large uraemic effusion is followed with comprehensive echo and intensified dialysis.</li></ol>' +
    '<h3>Heart failure and ventricular function</h3><ol>' +
    '<li><b>PLAX</b> at the mitral tips, end-diastole: cavity size by eye against 42–58 mm (men) and 38–52 mm (women); wall thickness against 6–10 mm (men) and 6–9 mm (women) (Lang 2015 · PMID 25559473). Mitral opening against the septum (EPSS of 7 mm or less makes an EF of 30% or below unlikely; over 7 mm is not specific: McKaigney 2014 · PMID 24630604 ⚑, one emergency-department series).</li>' +
    '<li><b>PSAX mid-papillary</b>: global against regional squeeze; septal shape in systole and diastole.</li>' +
    '<li><b>A4C</b>: all walls, EF by category (normal, mildly, moderately, severely reduced), RV against LV size, atrial size.</li>' +
    '<li><b>RV</b>: an RV larger than the LV is likely significantly enlarged (Rudski 2010 · PMID 20620859, qualitative); TAPSE under 17 mm is abnormal (Lang 2015).</li>' +
    '<li><b>Congestion</b>: IVC and VExUS (Session 5), B-lines (Session 3). This is where the dialysis decision is made.</li>' +
    '<li><b>Rhythm</b>: in AF or tachycardia estimate over several beats; use the slider and the AF switch here to see why.</li>' +
    '<li><b>Pitfalls</b>: foreshortening (round, thick apex), oblique PSAX, under-filling after dialysis mimicking hypertrophy or hyperdynamic failure.</li>' +
    '<li><b>Refer</b> for biplane EF, diastolic grading (Nagueh 2025 · PMID 40617625), valve quantitation.</li></ol>' +
    '<h3>Valves: screening in a focused study</h3><ol>' +
    '<li><b>2D first</b>: leaflet thickness, calcium and its shadow, mobility, and the chambers downstream (LA size, LV size and wall thickness, RV size).</li>' +
    '<li><b>Colour</b>: box over the valve, Nyquist 50–60 cm/s, gain just below the level that speckles the tissue. A regurgitant jet appears on the far side of a closed valve in the right phase: systole for MR and TR, diastole for AR.</li>' +

    '<li><b>Pitfalls</b>: low gain hides jets, low Nyquist aliases normal inflow, wall-hugging jets look small, calcium shadows what lies behind it.</li></ol>' +
